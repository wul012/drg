{% extends 'base.html' %}

{% block title %}需求分析 - 医保DRG智能协同平台{% endblock %}

{% block content %}
<header class="topbar">
    <div>
        <h1>项目需求分析</h1>
        <p>这里会把系统需求、代码和设计信息写入数据库，并联动生成需求分析、架构设计与测试文档。</p>
    </div>
    <div class="topbar-actions">
        <span class="badge">主流程第一站</span>
        <span class="badge">大模型生成</span>
    </div>
</header>

<section class="panel-grid two-columns analysis-page-grid">
    <article class="panel">
        <div class="panel-header">
            <h3>需求录入区</h3>
        </div>
        <form class="form-grid" id="analysis_form" method="post">
            <div class="field">
                <label for="project_name">项目名称</label>
                <input class="input" id="project_name" name="project_name" type="text" value="{{ form_data['project_name'] }}" required />
            </div>
            <div class="field">
                <label for="description">系统需求</label>
                <textarea class="textarea" id="description" name="description" required>{{ form_data['description'] }}</textarea>
            </div>
            <div class="field">
                <label for="system_code">系统代码</label>
                <textarea class="textarea" id="system_code" name="system_code">{{ form_data['system_code'] }}</textarea>
            </div>
            <div class="field">
                <label for="design_info">设计信息</label>
                <textarea class="textarea" id="design_info" name="design_info">{{ form_data['design_info'] }}</textarea>
            </div>
            <div class="field">
                <label for="target">目标产物</label>
                <textarea class="textarea" id="target" name="target" required>{{ form_data['target'] }}</textarea>
            </div>
            <div class="field">
                <label for="priority">优先级</label>
                <select class="input" id="priority" name="priority">
                    <option value="高" {% if form_data['priority'] == '高' %}selected{% endif %}>高</option>
                    <option value="中" {% if form_data['priority'] == '中' %}selected{% endif %}>中</option>
                    <option value="低" {% if form_data['priority'] == '低' %}selected{% endif %}>低</option>
                </select>
            </div>
            <div class="form-actions">
                <button class="button" type="submit">开始分析并同步数据</button>
                <a class="button-secondary" href="{{ url_for('documents_page') }}">提交至文档中心</a>
            </div>
        </form>
    </article>

    <article class="panel analysis-result-panel">
        <div class="panel-header analysis-panel-header">
            <h3>分析结果区</h3>
        </div>
        <div class="result-grid analysis-result-grid" id="analysis_result"></div>
    </article>
</section>
{% endblock %}
